<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App de exemplo</title>
<!-- Modo demonstração (0.17.0): página que faz o papel de um app dentro da Janela de app. -->
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; background: #f4f6fb; color: #1d2433; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: #fff; box-shadow: 0 1px 0 #e3e7f0; }
  header b { font-size: 16px; }
  header span { margin-left: auto; font-size: 12px; color: #6b7487; }
  main { padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; align-content: start; overflow: auto; }
  .card { height: 120px; border-radius: 14px; background: linear-gradient(135deg, #8ec5fc, #e0c3fc); box-shadow: 0 4px 14px rgba(30,40,80,.08); }
  .card:nth-child(3n) { background: linear-gradient(135deg, #fbc2eb, #a6c1ee); }
  .card:nth-child(3n+2) { background: linear-gradient(135deg, #a1ffce, #faffd1); }
  p { grid-column: 1 / -1; margin: 0 0 4px; font-size: 14px; color: #4a5266; line-height: 1.5; }
</style>
</head>
<body>
<header><b>App de exemplo</b><span>modo demonstração</span></header>
<main>
  <p>Num servidor de verdade, aqui aparece o app do Runtipi (Immich, Plex, AdGuard...). Experimente minimizar,
    maximizar, arrastar pela barra e encaixar nas laterais da tela.</p>
  <div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div>
  <div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div>
</main>
</body>
</html>
