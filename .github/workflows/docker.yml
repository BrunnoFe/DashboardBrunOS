# Testa a cada push. Na main, publica ghcr.io/<seu-usuario>/brunos:<VERSION> (e latest) quando o
# arquivo VERSION traz uma versão que ainda não existe no registro. Para lançar: mude VERSION e faça push.
# Tags v* também publicam. A publicação só acontece se o teste passar.
name: teste e imagem docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: teste com Docker de verdade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go vet e build
        run: go vet ./... && CGO_ENABLED=0 go build ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Gera a imagem
        run: docker build -t brunos:ci --build-arg VERSION=ci .
      - name: Teste de fumaça (container + proxy do Docker + checagens da API)
        run: bash tests/smoke.sh brunos:ci

  publish:
    name: publica a imagem
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Decide a versão
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(tr -d ' \n' < VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/brunos:$v"
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1 && docker manifest inspect "$img" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$img já existe; nada a publicar."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "publicando $img"
          fi
      - if: steps.ver.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.ver.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.ver.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.ver.outputs.skip != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/brunos
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest
      - if: steps.ver.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
