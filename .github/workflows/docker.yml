# Testa a cada push. Na main, publica ghcr.io/<seu-usuario>/brunos:<VERSION> (e latest) quando o
# arquivo VERSION traz uma versão que ainda não existe no registro. Para lançar: mude VERSION e faça push.
# Tags v* também publicam. A publicação só acontece se o teste passar.
name: teste e imagem docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: teste com Docker de verdade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Confere o vendor/ com os módulos oficiais (verificados no sum.golang.org)
        run: |
          set -euo pipefail
          declare -A dirs
          for m in golang.org/x/crypto@v0.48.0 golang.org/x/sys@v0.41.0; do
            d=$(cd "$(mktemp -d)" && go mod download -json "$m" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Dir"])')
            dirs[${m%@*}]=$d
          done
          n=0
          while IFS= read -r f; do
            mod=$(echo "$f" | cut -d/ -f1-3); rel=${f#"$mod"/}
            cmp -s "vendor/$f" "${dirs[$mod]}/$rel" || { echo "DIFERENTE: $f"; exit 1; }
            n=$((n+1))
          done < <(cd vendor && find golang.org -type f)
          echo "vendor confere com os módulos oficiais ($n arquivos)"
      - name: go vet, testes e build
        run: go vet ./... && go test -race -count=1 ./... && CGO_ENABLED=0 go build ./...
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -v '^vendor/'))" || (gofmt -l . && exit 1)
      - name: Gera a imagem
        run: docker build -t brunos:ci --build-arg VERSION=ci .
      - name: Teste de fumaça (container + proxy do Docker + checagens da API)
        run: bash tests/smoke.sh brunos:ci
      - name: Script do servidor se atualiza só com assinatura válida (como root, num contêiner)
        run: bash tests/script-selfupdate.sh

  publish:
    name: publica a imagem
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Decide a versão
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(tr -d ' \n' < VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/brunos:$v"
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1 && docker manifest inspect "$img" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$img já existe; nada a publicar."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "publicando $img"
          fi
      - if: steps.ver.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.ver.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.ver.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.ver.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # Assina o script do servidor (decisão 49): o brunos-host instalado só se troca por um script
      # assinado por esta chave. A chave privada fica só no segredo BRUNOS_SCRIPT_KEY.
      - name: Assina o script do servidor
        if: steps.ver.outputs.skip != 'true'
        env:
          CHAVE: ${{ secrets.BRUNOS_SCRIPT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CHAVE" ]; then
            echo "::warning::sem o segredo BRUNOS_SCRIPT_KEY: nesta versão o script do servidor não se atualiza sozinho"
            exit 0
          fi
          umask 077
          d=$(mktemp -d)
          # o segredo pode ter vindo do Windows (CRLF, marca BOM): o ssh-keygen só lê a chave com LF puro
          printf '%s\n' "$CHAVE" | tr -d '\r' | sed '1s/^\xEF\xBB\xBF//' >"$d/chave"
          head -n 1 "$d/chave" | grep -q '^-----BEGIN OPENSSH PRIVATE KEY-----$' || { echo "::error::o segredo BRUNOS_SCRIPT_KEY não parece uma chave privada OpenSSH"; exit 1; }
          go run ./tools/hostscript >"$d/brunos-host"
          ssh-keygen -q -Y sign -f "$d/chave" -n brunos-host "$d/brunos-host"
          # confere com a chave pública que está dentro do próprio script antes de embutir
          printf 'brunos-release %s\n' "$(sed -n "s/^CHAVE_ASSINATURA='\(.*\)'\$/\1/p" "$d/brunos-host")" >"$d/assinantes"
          ssh-keygen -Y verify -f "$d/assinantes" -I brunos-release -n brunos-host -s "$d/brunos-host.sig" <"$d/brunos-host"
          base64 -w0 "$d/brunos-host.sig" >internal/hostcmd/assinatura.txt
          rm -rf "$d"
          echo "script do servidor assinado"
      - id: meta
        if: steps.ver.outputs.skip != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/brunos
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest
      - if: steps.ver.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
